apiVersion: v1
kind: ServiceAccount
metadata: { name: {{ include "dmo.name" . }} }
---
# Namespaced on purpose: the controller needs no cluster-wide rights. It may manage JobRuns and the Jobs, Pods (to read the
# runner's answer) and ConfigMaps (where the full result is kept) of its own namespace. Job pods themselves get no API access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: {{ include "dmo.name" . }} }
rules:
  - apiGroups: [datamodel.bmll.io]
    resources: [jobruns, jobruns/status]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: {{ include "dmo.name" . }} }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "dmo.name" . }} }
subjects: [{ kind: ServiceAccount, name: {{ include "dmo.name" . }} }]
