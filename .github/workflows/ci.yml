name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bmlltech/data-model
          path: data-model
          token: ${{ secrets.DATAMODEL_READ_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e '.[controller,test]' && pip install pyyaml jsonschema
      - name: The vendored contract is the model's
        run: |
          scripts/sync_contract.sh data-model
          git diff --exit-code -- contract ':!contract/SOURCE'
      - run: DATAMODEL_PATH=data-model python3 -m pytest
